plugins { id 'com.android.application' }

android {
    namespace 'io.github.matrixneo23.mdrelaycompanion'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.matrixneo23.mdrelaycompanion'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
