name: Dual Chat CI

on:
  push:
    paths:
      - 'projects/dual-instance-shared-chat/**'
      - '.github/workflows/dual-chat-ci.yml'
  pull_request:
    paths:
      - 'projects/dual-instance-shared-chat/**'
      - '.github/workflows/dual-chat-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/dual-instance-shared-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: projects/dual-instance-shared-chat/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
