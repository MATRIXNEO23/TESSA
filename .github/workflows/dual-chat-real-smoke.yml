name: Dual Chat Real Responses Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/dual-instance-shared-chat/.real-smoke-trigger'

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/dual-instance-shared-chat
    env:
      REAL_RESPONSES_ENABLED: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_MAX_OUTPUT_TOKENS: '160'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: projects/dual-instance-shared-chat/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Require server-side provider credential
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Provider credential is required for the real smoke"
            exit 2
          fi
      - run: npm run smoke:real
