name: One-time correspondence repair

on:
  push:
    paths:
      - '.github/workflows/one-time-correspondence-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild canonical transcript preserving turns 1-17
        shell: bash
        run: |
          set -euo pipefail
          path='agent-exchanges/correspondence/2026-09-17-bootstrap-001.md'
          git show 98bee00fe273380f32ced3027e5089378ae20321:"$path" > /tmp/canonical.md
          printf '\n\n---\n\n' >> /tmp/canonical.md
          git show d64154c3752f8ba00f7999d26a4085faf6c1b51d:"$path" | awk '/^## Turno 17 — GPTina — 2026-09-17$/{found=1} found' >> /tmp/canonical.md
          test "$(grep -c '^## Turno [0-9][0-9]* —' /tmp/canonical.md)" -eq 17
          test "$(grep -c '^## Turno 17 — GPTina — 2026-09-17$' /tmp/canonical.md)" -eq 1
          ! grep -q '^\[Turni 1–16 invariati' /tmp/canonical.md
          cp /tmp/canonical.md "$path"
          git config user.name 'Tessa recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add "$path"
          git commit -m 'Repair correspondence preserving turns 1-17'
          git push
