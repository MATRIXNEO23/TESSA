name: Build MD Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/dual-instance-shared-chat/md-companion-android/**'
      - '.github/workflows/build-md-companion-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/dual-instance-shared-chat/md-companion-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Guard no ChatGPT UI automation
        run: |
          ! grep -R "evaluateJavascript\|dispatchTouchEvent\|MotionEvent\|KeyEvent\|KeyCharacterMap" app/src/main/java

      - name: Restore persistent signing key
        if: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 != '' }}
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > signing-key.jks
          chmod 600 signing-key.jks

      - name: Build release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 != '' && format('{0}/projects/dual-instance-shared-chat/md-companion-android/signing-key.jks', github.workspace) || '' }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify signed release when signing secret exists
        if: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 != '' }}
        run: test -f app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tessa-gptina-md-companion-apk
          path: projects/dual-instance-shared-chat/md-companion-android/app/build/outputs/apk/release/*.apk
