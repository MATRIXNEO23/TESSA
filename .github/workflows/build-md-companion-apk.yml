name: Build MD Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/dual-instance-shared-chat/md-companion-android/**'
      - '.github/workflows/build-md-companion-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/dual-instance-shared-chat/md-companion-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tessa-gptina-md-companion-apk
          path: projects/dual-instance-shared-chat/md-companion-android/app/build/outputs/apk/debug/app-debug.apk
