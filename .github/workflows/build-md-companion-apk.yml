name: Build MD Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/dual-instance-shared-chat/md-companion-android/**'
      - '.github/workflows/build-md-companion-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/dual-instance-shared-chat/md-companion-android

    env:
      ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/projects/dual-instance-shared-chat/md-companion-android/signing-key.jks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Guard no ChatGPT UI automation
        run: |
          ! grep -R "evaluateJavascript\|dispatchTouchEvent\|MotionEvent\|KeyEvent\|KeyCharacterMap" app/src/main/java

      - name: Restore persistent signing key when configured
        run: |
          if [ -n "$ANDROID_SIGNING_KEY_BASE64" ]; then
            printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > signing-key.jks
            chmod 600 signing-key.jks
          fi

      - name: Build release APK
        run: gradle assembleRelease

      - name: Verify release output
        run: |
          if [ -n "$ANDROID_SIGNING_KEY_BASE64" ]; then
            test -f app/build/outputs/apk/release/app-release.apk
          else
            test -f app/build/outputs/apk/release/app-release-unsigned.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tessa-gptina-md-companion-apk
          path: projects/dual-instance-shared-chat/md-companion-android/app/build/outputs/apk/release/*.apk
